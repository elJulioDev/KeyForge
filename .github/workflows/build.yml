name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: KeyForge_linux
          - os: windows-latest
            artifact_name: KeyForge.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Install PyInstaller
        run: uv add --dev pyinstaller

      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: >
          uv run pyinstaller
          --onefile
          --name ${{ matrix.artifact_name }}
          --collect-all ttkbootstrap
          --hidden-import PIL._tkinter_finder
          --add-data "data/lang.json:data"
          --add-data "assets:assets"
          --clean
          main.py

      - name: Build executable (Windows)
        if: runner.os == 'Windows'
        run: >
          uv run pyinstaller
          --onefile
          --name ${{ matrix.artifact_name }}
          --collect-all ttkbootstrap
          --hidden-import PIL._tkinter_finder
          --add-data "data/lang.json;data"
          --add-data "assets;assets"
          --clean
          main.py

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: KeyForge_linux
          path: dist/KeyForge_linux

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: KeyForge.exe
          path: dist/KeyForge.exe
