[project]
name = "keyforge"
version = "1.5.0"
description = "Key remapping tool"
requires-python = ">=3.11"
dependencies = [
    "ttkbootstrap>=1.19.0",
    "keyboard>=0.13.5",
    "pygetwindow>=0.0.9",
    "requests>=2.31.0",
    "packaging>=23.0",
    "Pillow>=10.0.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = []
